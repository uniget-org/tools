# yaml-language-server: $schema=https://tools.uniget.dev/schema.yaml
name: vibe
description: AI coding agent by Mistral with terminal TUI and Agent Client Protocol support
license:
  name: Apache License 2.0
  link: https://github.com/mistralai/mistral-vibe/blob/main/LICENSE
homepage: https://mistral.ai
repository: https://github.com/mistralai/mistral-vibe
version: "3.0.2"
tags:
- type/cli
- type/tui
- category/development
- lang/python
- org/mistral
- ai
- llm
- coding
- agent
check: ${binary} --version | cut -d' ' -f2
build_dependencies:
- python-3.14
- shiv
runtime_dependencies:
- python-3.14
platforms:
- linux/amd64
- linux/arm64
messages:
  usage: |
    Version 3 requires Python 3.14.
renovate:
  datasource: pypi
  package: mistral-vibe
