# yaml-language-server: $schema=https://tools.uniget.dev/schema.yaml
$schema: https://tools.uniget.dev/schema.yaml
name: katenary
description: Convert docker and podman compose to a configurable Helm Chart
license:
  name: MIT License
  link: https://repo.katenary.io/Katenary/katenary/src/branch/master/LICENSE
homepage: https://katenary.io
repository: https://repo.katenary.io/Katenary/katenary
version: "3.0.0"
tags:
- container/compose
- type/cli
- kubernetes
- lang/go
- helm
check: ${binary} version | cut -d' ' -f3
platforms:
- linux/amd64
- linux/arm64
renovate:
  datasource: git-tags
  package: https://repo.katenary.io/Katenary/katenary.git
  extractVersion: ^releases/(?<version>.+)$
