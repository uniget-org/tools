# yaml-language-server: $schema=https://tools.uniget.dev/schema.yaml
$schema: https://tools.uniget.dev/schema.yaml
name: somo
description: Human-friendly alternative to netstat for socket
license:
  name: MIT License
  link: https://github.com/theopfr/somo/blob/master/LICENSE
homepage: https://github.com/theopfr/somo
repository: https://github.com/theopfr/somo
version: "1.4.0"
tags:
- category/terminal
- lang/rust
- type/cli
- component/network
check: ${binary} --version | cut -d' ' -f2
platforms:
- linux/amd64
- linux/arm64
renovate:
  datasource: github-releases
  package: theopfr/somo
  extractVersion: ^v(?<version>.+)$
