# yaml-language-server: $schema=https://tools.uniget.dev/schema.yaml
$schema: https://tools.uniget.dev/schema.yaml
name: openclaude
description: Open-source coding-agent CLI for cloud and local model providers, derived from Claude Code
license:
  name: MIT
  link: https://github.com/Twigpine/openclaude/blob/main/LICENSE
homepage: https://openclaude.twigpine.com
repository: https://github.com/Twigpine/openclaude
version: "0.33.0"
tags:
- category/development
- lang/javascript
- type/cli
- ai
- llm
- mcp
- coding
- agent
check: ${binary} --version | grep -oP '\d+\.\d+\.\d+'
build_dependencies:
- node-lts
runtime_dependencies:
- node-lts
platforms:
- linux/amd64
- linux/arm64
renovate:
  datasource: npm
  package: "@twigpine/openclaude"
