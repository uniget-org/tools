# yaml-language-server: $schema=https://tools.uniget.dev/schema.yaml
$schema: https://tools.uniget.dev/schema.yaml
name: pktz
description: eBPF-powered network traffic monitor - per process, per connection, live
license:
  name: MIT License
  link: https://github.com/immanuwell/pktz/blob/main/LICENSE
homepage: https://github.com/immanuwell/pktz
repository: https://github.com/immanuwell/pktz
version: "0.3.0"
tags:
- category/monitoring
- lang/go
- type/tui
- ai
- llm
- coding
- agent
