# yaml-language-server: $schema=https://tools.uniget.dev/schema.yaml
$schema: https://tools.uniget.dev/schema.yaml
name: opensre
description: Open-source agent for CI/CD reliability that investigates failed runs and pushes fixes for review
license:
  name: Apache-2.0
  link: https://github.com/Tracer-Cloud/opensre/blob/main/LICENSE
homepage: https://www.opensre.com
repository: https://github.com/Tracer-Cloud/opensre
version: "0.1.2026.11.2"
tags:
- category/operations
- lang/python
- type/cli
- ai
- llm
- agent
- mcp
- monitoring
check: ${binary} --version | cut -d' ' -f3
platforms:
- linux/amd64
- linux/arm64
renovate:
  datasource: github-releases
  package: Tracer-Cloud/opensre
  extractVersion: ^v(?<version>.+)$
