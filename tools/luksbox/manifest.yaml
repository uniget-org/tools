# yaml-language-server: $schema=https://tools.uniget.dev/schema.yaml
$schema: https://tools.uniget.dev/schema.yaml
name: luksbox
description: Encrypted container tool with FIDO2, TPM 2.0, and post-quantum keyslots
license:
  name: Apache License 2.0
  link: https://github.com/PentHertz/LUKSbox/blob/main/LICENSE
homepage: https://luksbox.penthertz.com
repository: https://github.com/PentHertz/LUKSbox
version: "0.5.2"
tags:
- type/cli
- category/security
- encryption
- lang/rust
- stability/prerelease
check: ${binary} --version | grep -oP '\d+\.\d+\.\d+'
runtime_dependencies:
- fuse3
platforms:
- linux/amd64
- linux/arm64
renovate:
  datasource: github-releases
  package: PentHertz/LUKSbox
  extractVersion: ^v(?<version>.+)$