# yaml-language-server: $schema=https://tools.uniget.dev/schema.yaml
$schema: https://tools.uniget.dev/schema.yaml
name: kubetail
description: Real-time logging dashboard for Kubernetes
license:
  name: Apache-2.0
  link: https://github.com/kubetail-org/kubetail/blob/main/LICENSE
homepage: https://www.kubetail.com
repository: https://github.com/kubetail-org/kubetail
version: "0.18.0"
tags:
- category/kubernetes
- lang/go
- type/cli
check: ${binary} --version
platforms:
- linux/amd64
- linux/arm64
renovate:
  datasource: github-releases
  package: kubetail-org/kubetail
  extractVersion: ^cli/v(?<version>.+)$
