# yaml-language-server: $schema=https://tools.uniget.dev/schema.yaml
$schema: https://tools.uniget.dev/schema.yaml
name: util-linux
description: Rust reimplementation of the util-linux project
license:
  name: MIT
  link: https://github.com/uutils/util-linux/blob/main/LICENSE
homepage: https://uutils.org
repository: https://github.com/uutils/util-linux
version: "0.0.1"
tags:
- type/cli
- category/helper
- lang/rust
check: ${binary} --help | head -1 | cut -d' ' -f2
build_dependencies:
- rust
platforms:
- linux/amd64
- linux/arm64
renovate:
  datasource: github-tags
  package: uutils/util-linux
  extractVersion: ^v?(?<version>.+)$
