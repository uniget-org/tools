# yaml-language-server: $schema=https://tools.uniget.dev/schema.yaml
$schema: https://tools.uniget.dev/schema.yaml
name: ghostty-noble
description: Fast, feature-rich, and cross-platform terminal emulator that uses platform-native UI and GPU acceleration
license:
  name: MIT License
  link: https://github.com/ghostty-org/ghostty/blob/main/LICENSE
homepage: https://ghostty.org
repository: https://github.com/ghostty-org/ghostty
version: "1.4.0"
tags:
- category/terminal
- lang/zig
- type/gui
binary: ghostty
check: ${binary} --version | grep ^Ghostty | cut -d' ' -f2
runtime_dependencies:
- ghostty
- bubblewrap
platforms:
- linux/amd64
- linux/arm64
messages:
  internals: |
    This packages an AppImage from https://github.com/pkgforge-dev/ghostty-appimage
  update: |
    Activate the desktop integrations by running the following commands:
    $ update-desktop-database -v ~/.local/share/applications
renovate:
  datasource: github-tags
  package: ghostty-org/ghostty
  extractVersion: ^v(?<version>.+)$
