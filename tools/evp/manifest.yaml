# yaml-language-server: $schema=https://tools.uniget.dev/schema.yaml
$schema: https://tools.uniget.dev/schema.yaml
name: evp
description: A terminal recoder powered by libghostty and rust
license:
  name: MIT License
  link: https://github.com/HalFrgrd/evp/blob/main/LICENSE
homepage: https://github.com/HalFrgrd/evp
repository: https://github.com/HalFrgrd/evp
version: "0.20.0"
