# yaml-language-server: $schema=https://tools.uniget.dev/schema.yaml
$schema: https://tools.uniget.dev/schema.yaml
name: terminal-browser
description: A real browser that runs inside your terminal
license:
  name: MIT
  link: https://github.com/zenbu-labs/terminal-browser/blob/main/LICENSE
homepage: https://terminal-browser.com
repository: https://github.com/zenbu-labs/terminal-browser
version: "0.16.3"
tags:
- category/terminal
- lang/rust
- type/cli
check: cut -d'v' -f2 "${target}/libexec/terminal-browser/VERSION"
platforms:
- linux/amd64
- linux/arm64
renovate:
  datasource: github-releases
  package: zenbu-labs/terminal-browser
  extractVersion: ^v(?<version>.+)$
