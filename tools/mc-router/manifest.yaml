# yaml-language-server: $schema=https://tools.uniget.dev/schema.yaml
$schema: https://tools.uniget.dev/schema.yaml
name: mc-router
description: Routes Minecraft Java Edition client connections to backend servers based upon the requested server address
license:
  name: MIT License
  link: https://github.com/itzg/mc-router/blob/master/LICENSE.txt
homepage: https://github.com/itzg/mc-router
repository: https://github.com/itzg/mc-router
version: "1.55.0"
tags:
- category/games
- lang/go
- type/cli
- type/daemon
- minecraft
check: ${binary} --version | cut -d, -f1
platforms:
- linux/amd64
- linux/arm64
renovate:
  datasource: github-releases
  package: itzg/mc-router
  extractVersion: ^v(?<version>.+)$
