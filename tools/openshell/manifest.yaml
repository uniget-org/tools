# yaml-language-server: $schema=https://tools.uniget.dev/schema.yaml
$schema: https://tools.uniget.dev/schema.yaml
name: openshell
description: Safe, private runtime for fleets of autonomous AI agents with kernel-level sandbox enforcement and formally verified policies
license:
  name: Apache License 2.0
  link: https://github.com/NVIDIA/OpenShell/blob/main/LICENSE
homepage: https://docs.nvidia.com/openshell/latest/
repository: https://github.com/NVIDIA/OpenShell
version: "0.1.5"
tags:
- org/nvidia
- ai
- agent
- category/security
- category/development
- lang/rust
- type/cli
check: ${binary} --version | cut -d' ' -f2
build_dependencies: []
platforms:
- linux/amd64
- linux/arm64
renovate:
  datasource: github-releases
  package: NVIDIA/OpenShell
  extractVersion: ^v(?<version>.+)$
