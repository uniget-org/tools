# yaml-language-server: $schema=https://tools.uniget.dev/schema.yaml
$schema: https://tools.uniget.dev/schema.yaml
name: gt
description: Official Gitea CLI, successor of tea
license:
  name: MIT
  link: https://gitea.com/gitea/cli/src/branch/main/LICENSE
homepage: https://gitea.com/gitea/cli
repository: https://gitea.com/gitea/cli
version: "1.2.0"
tags:
- org/gitea
- category/development
- lang/go
- type/cli
check: ${binary} --version | head -n 1 | cut -d' ' -f3
platforms:
- linux/amd64
- linux/arm64
renovate:
  datasource: git-tags
  package: https://gitea.com/gitea/cli.git
  extractVersion: ^v(?<version>.+)$
