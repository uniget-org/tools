# yaml-language-server: $schema=https://tools.uniget.dev/schema.yaml
$schema: https://tools.uniget.dev/schema.yaml
name: snoop
description: Modern syscall tracer built on eBPF with TUI, smart filters, and TLS decryption
license:
  name: MIT OR Apache-2.0
  link: https://github.com/pandaadir05/snoop/blob/main/LICENSE
homepage: https://github.com/pandaadir05/snoop
repository: https://github.com/pandaadir05/snoop
version: "0.1.0"
tags:
- type/cli
- type/tui
- category/development
- category/security
- lang/rust
check: ${binary} --version
platforms:
- linux/amd64
- linux/arm64
renovate:
  datasource: github-releases
  package: pandaadir05/snoop
  extractVersion: ^v(?<version>.+)$
