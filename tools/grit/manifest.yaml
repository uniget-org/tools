# yaml-language-server: $schema=https://tools.uniget.dev/schema.yaml
$schema: https://tools.uniget.dev/schema.yaml
name: grit
description: Git reimplementation in Rust with a simpler workflow-oriented CLI
license:
  name: MIT
  link: https://github.com/gitbutlerapp/grit/blob/main/LICENSE
homepage: https://grit-scm.com
repository: https://github.com/gitbutlerapp/grit
version: "0.5.0"
tags:
- type/cli
- category/development
- lang/rust
- standard/git
check: ${binary} --version | cut -d' ' -f2
platforms:
- linux/amd64
- linux/arm64
renovate:
  datasource: github-releases
  package: gitbutlerapp/grit
  extractVersion: ^v(?<version>.+)$
