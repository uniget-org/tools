# yaml-language-server: $schema=https://tools.uniget.dev/schema.yaml
$schema: https://tools.uniget.dev/schema.yaml
name: codex-security
description: CLI and TypeScript SDK for finding, validating, and fixing security vulnerabilities in code.
license:
  name: Apache License 2.0
  link: https://github.com/openai/codex-security/blob/main/LICENSE
homepage: https://github.com/openai/codex-security
repository: https://github.com/openai/codex-security
version: "0.1.19"
tags:
- category/security
- lang/javascript
- type/cli
check: ${binary} --version
build_dependencies:
- node-lts
runtime_dependencies:
- node-lts
platforms:
- linux/amd64
- linux/arm64
renovate:
  datasource: npm
  package: "@openai/codex-security"
binary: codex-security
