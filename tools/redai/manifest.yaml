# yaml-language-server: $schema=https://tools.uniget.dev/schema.yaml
$schema: https://tools.uniget.dev/schema.yaml
name: redai
description: AI-driven vulnerability discovery and live validation
license:
  name: MIT License
  link: https://github.com/kpolley/redai/blob/main/LICENSE
homepage: https://github.com/kpolley/redai
repository: https://github.com/kpolley/redai
version: "0.1.3"
tags:
- category/security
- lang/typescript
- type/tui
- ai
check: ${binary} --version 2>/dev/null | grep -oP '\d+\.\d+\.\d+'
build_dependencies:
- bun
runtime_dependencies:
- bun
platforms:
- linux/amd64
- linux/arm64
renovate:
  datasource: npm
  package: "@kpolley/redai"