# yaml-language-server: $schema=https://tools.uniget.dev/schema.yaml
$schema: https://tools.uniget.dev/schema.yaml
name: gtk4-layer-shell
description: create panels and other desktop components for Wayland using the Layer Shell protocol and GTK4
license:
  name: MIT License
  link: https://github.com/wmww/gtk4-layer-shell/blob/main/LICENSE
homepage: https://github.com/wmww/gtk4-layer-shell
repository: https://github.com/wmww/gtk4-layer-shell
version: "1.3.0"
tags:
- category/development
- lang/c
- type/library
check: ${binary} | grep -oP '\d+\.\d+\.\d+'
platforms:
- linux/amd64
- linux/arm64
renovate:
  datasource: github-releases
  package: wmww/gtk4-layer-shell
  extractVersion: ^v?(?<version>.+)$
